[project]
name = "whatsapp-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[openai,anthropic]",
    "python-dotenv",
    "strands-agents-tools",
    "neonize>=0.4.3.post0,<0.5",
    "pyyaml",
    "pillow>=12.1.1",
    "mcp>=1.26.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
]

[tool.ruff]
exclude = [".venv"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
