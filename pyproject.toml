[project]
name = "whatsapp-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "strands-agents",
    "strands-agents-tools",
    "neonize",
    "pyyaml",
    "pillow>=12.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
]

[tool.ruff]
exclude = [".venv"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
